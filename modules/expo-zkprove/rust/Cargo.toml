[package]
name = "khabardar-zkprove"
version = "0.1.0"
edition = "2021"
publish = false
description = "On-device Groth16 proving so a phone can generate Semaphore proofs"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "khabardar_zkprove"

[dependencies]
# Circom R1CS + witness generation, and Groth16 over BN254 — the curve and
# proof system Semaphore's circuits are compiled for. Anything else here would
# produce proofs the deployed verifier rejects.
ark-circom = "0.6"
ark-groth16 = { version = "0.6", default-features = false }
ark-bn254 = { version = "0.6", default-features = false, features = ["curve"] }
ark-ff = { version = "0.6", default-features = false }
ark-ec = { version = "0.6", default-features = false }
ark-serialize = { version = "0.6", default-features = false }
ark-std = { version = "0.6", default-features = false }
ark-relations = { version = "0.5", default-features = false }
num-bigint = { version = "0.4", default-features = false }
num-traits = "0.2"
rand = "0.8"
thiserror = "2"
once_cell = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The witness calculator is a circom-generated wasm module; ark-circom runs it
# on wasmer, so the version has to match the one ark-circom links against.
# Must match the version ark-circom links against exactly — two wasmer
# versions in one tree means two incompatible `Store` types, and the error
# says only "expected Store, found Store".
wasmer = { version = "6.1.0-rc.3", default-features = false, features = ["default"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.14"

[profile.release]
opt-level = 3          # proving is CPU-bound; size matters less than seconds
lto = true
codegen-units = 1
panic = "abort"
strip = true
