apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'expo.modules.zkprove'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

/**
 * ABIs to build, overridable for local work.
 *
 * Each one is a separate full build of the prover and its wasm runtime, so the
 * full set costs real CI minutes and real megabytes. Someone iterating against
 * an emulator needs exactly one: `-PkhabardarAbis=x86_64`.
 *
 * Release builds must not set this. See DEVELOPING.md.
 */
def enabledAbis = ((project.findProperty('khabardarAbis') ?: 'arm64-v8a,armeabi-v7a,x86_64') as String)
  .split(',').collect { it.trim() }.findAll { it }

android {
  namespace "expo.modules.zkprove"
  defaultConfig {
    minSdkVersion 24
    compileSdkVersion 35
    ndk {
      abiFilters.addAll(enabledAbis)
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
  sourceSets {
    main {
      jniLibs.srcDirs = ['src/main/jniLibs']
    }
  }
}

/**
 * Cross-compile the prover for every enabled ABI.
 *
 * Requires the Android NDK and `cargo-ndk`:
 *   cargo install cargo-ndk
 *   rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
 *
 * Skipped when the toolchain is absent so a checkout without Rust still opens
 * in Android Studio. The app then reports proving as unavailable rather than
 * crashing — see ZkNative.available — which is loud in the right way.
 */
def rustDir = file("${projectDir}/../rust")

/**
 * Fail early and legibly when a Rust target is missing.
 *
 * Without this, `cargo ndk` fails partway through the Gradle build with a raw
 * toolchain error that says nothing about `rustup target add`. The ABI list
 * here and the `abiFilters` above have to agree, and it is easy for a machine
 * to have only some of them installed.
 */
def requiredRustTargets = [
  'arm64-v8a'   : 'aarch64-linux-android',
  'armeabi-v7a' : 'armv7-linux-androideabi',
  'x86_64'      : 'x86_64-linux-android',
]

task checkRustTargets {
  doLast {
    // If rustup itself is absent there is no toolchain to check, and the
    // `onlyIf` on the build task below already handles that case by skipping
    // the native build with a warning. Failing here instead would break the
    // documented "opens in Android Studio without Rust" path.
    def installed
    try {
      installed = "rustup target list --installed".execute().text
    } catch (IOException ignored) {
      logger.warn("expo-zkprove: rustup not found — skipping Rust target check.")
      return
    }
    // Only the ABIs actually being built need a toolchain.
    def missing = requiredRustTargets
      .findAll { abi, triple -> enabledAbis.contains(abi) && !installed.contains(triple) }
    if (missing) {
      throw new GradleException(
        "expo-zkprove: no Rust target installed for ABI(s): " + missing.keySet().join(', ') +
        ". These are listed in abiFilters, so the build would fail partway " +
        "through with an opaque cargo error. Install them with: rustup target add " +
        missing.values().join(' ')
      )
    }
  }
}

task buildZkProver(type: Exec) {
  dependsOn checkRustTargets
  onlyIf {
    def hasCargo = System.getenv("PATH")
      ?.split(File.pathSeparator)
      ?.any { new File(it, isWindows() ? "cargo.exe" : "cargo").exists() } ?: false
    if (!hasCargo) {
      logger.warn("expo-zkprove: cargo not found — skipping the native prover build. " +
        "Zero-knowledge proving will report as unavailable at runtime.")
    }
    hasCargo
  }

  workingDir rustDir
  commandLine(['cargo', 'ndk'] +
    enabledAbis.collectMany { ['-t', it] } +
    ['-o', "${projectDir}/src/main/jniLibs", 'build', '--release'])
}

static def isWindows() {
  return System.getProperty('os.name').toLowerCase().contains('windows')
}

preBuild.dependsOn buildZkProver
