name: Bug report
description: Something behaves incorrectly
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        **If this is a security or anonymity issue, stop.** Do not file it here —
        report it privately via
        [Security → Report a vulnerability](https://github.com/sailenceresw/khabardar/security/advisories/new).
        See [SECURITY.md](https://github.com/sailenceresw/khabardar/blob/master/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create an identity
        2. New report → Bribery
        3. …
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Anonymity / identity / panic delete
        - Compose and submit
        - Public feed
        - Moderation queue
        - Tip channel
        - Chain / relayer / gasless
        - Content store / evidence
        - Organization workspace
        - Build, tooling, or CI
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web preview (expo web)
        - Android
        - iOS
        - Contracts / Node only
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Relevant config
      description: >
        Node version, and any non-default env — EXPO_PUBLIC_CONTENT_STORE,
        EXPO_PUBLIC_GASLESS_PROVIDER. Never paste an API key or a recovery phrase.
      placeholder: "Node 20.11, EXPO_PUBLIC_CONTENT_STORE=mock"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact anything user-derived before pasting.
      render: shell
